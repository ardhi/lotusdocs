{{ $sectionTitle := .Scratch.Get "sectionTitle" }}
{{ with (index .Site.Data.landing $sectionTitle) }}
{{ if eq .enable true }}
<section id="{{ $sectionTitle }}" class="{{ .bgColor }} py-5">
    <div class="container my-5">
        <div class="text-center">
            <svg width="100" height="100" class="text-secondary-emphasis" fill="currentColor" viewBox="0 0 25 25">
                <path d="M9.563 8.469l-.813-1.25C3.125 11 0 15.594.0 19.375c0 3.656 2.688 5.375 4.969 5.375 2.875.0 4.906-2.438 4.906-5 0-2.156-1.375-4-3.219-4.688-.531-.188-1.031-.344-1.031-1.25.0-1.156.844-2.875 3.938-5.344zm12.406.0-.813-1.25c-5.563 3.781-8.75 8.375-8.75 12.156.0 3.656 2.75 5.375 5.031 5.375 2.906.0 4.969-2.438 4.969-5 0-2.156-1.406-4-3.313-4.688-.531-.188-1-.344-1-1.25.0-1.156.875-2.875 3.875-5.344z"></path>
            </svg>
            <h4 class="mt-5">{{ .quote | markdownify }}</h4>
            <div class="mt-5 d-flex justify-content-center align-items-center">
                <img class="rounded-circle" src="{{ (resources.Get .imageSrc).RelPermalink }}" width="80" >
                <div class="d-flex flex-column ps-4">
                    <h5 class="mb-1">{{ .name }}</h5>
                    <div>{{ .title }}</div>
                </div>
            </div>
        </div>
    </div>
    <!--end container-->
</section>
{{ end }}
{{ end }}
